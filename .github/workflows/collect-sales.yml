name: Collect Sales

# 1) 매 15분마다 실시간 수집  2) 매일 23:55 KST 일/월/연 집계  3) 수동 실행 가능
on:
  schedule:
    - cron: "*/15 * * * *"      # 15분마다 (UTC 기준)
    - cron: "55 14 * * *"       # 23:55 KST = 14:55 UTC — 일별 마감 집계
  workflow_dispatch:
    inputs:
      mode:
        description: "collect | aggregate | all"
        default: "all"
        required: false

permissions:
  contents: write   # data/*.json 커밋용
  pages: write      # Pages 배포용
  id-token: write   # Pages 인증용

concurrency:
  group: collect-sales
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # ── 채널별 시크릿 (Settings > Secrets and variables > Actions 에 등록) ──
      CAFE24_MALL_ID:        ${{ secrets.CAFE24_MALL_ID }}
      CAFE24_CLIENT_ID:      ${{ secrets.CAFE24_CLIENT_ID }}
      CAFE24_CLIENT_SECRET:  ${{ secrets.CAFE24_CLIENT_SECRET }}
      CAFE24_REFRESH_TOKEN:  ${{ secrets.CAFE24_REFRESH_TOKEN }}

      SMARTSTORE_CLIENT_ID:     ${{ secrets.SMARTSTORE_CLIENT_ID }}
      SMARTSTORE_CLIENT_SECRET: ${{ secrets.SMARTSTORE_CLIENT_SECRET }}

      COUPANG_VENDOR_ID:  ${{ secrets.COUPANG_VENDOR_ID }}
      COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
      COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}

      MUSINSA_PARTNER_ID: ${{ secrets.MUSINSA_PARTNER_ID }}
      MUSINSA_API_KEY:    ${{ secrets.MUSINSA_API_KEY }}

      ABLY_API_KEY: ${{ secrets.ABLY_API_KEY }}

      SHOPBY_MALL_ID:       ${{ secrets.SHOPBY_MALL_ID }}
      SHOPBY_CLIENT_ID:     ${{ secrets.SHOPBY_CLIENT_ID }}
      SHOPBY_CLIENT_SECRET: ${{ secrets.SHOPBY_CLIENT_SECRET }}

      KAKAOSTYLE_API_KEY: ${{ secrets.KAKAOSTYLE_API_KEY }}

      # 일 매출 목표 (선택)
      DAILY_GOAL_KRW: ${{ vars.DAILY_GOAL_KRW }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # cache 옵션은 락파일이 있을 때만 동작하도록 분기
          cache: ${{ hashFiles('**/package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Collect (실시간)
        if: ${{ github.event.schedule == '*/15 * * * *' || github.event.inputs.mode == 'collect' || github.event.inputs.mode == 'all' || github.event.inputs.mode == '' }}
        run: npm run collect

      - name: Aggregate (일/월/연)
        if: ${{ github.event.schedule == '55 14 * * *' || github.event.inputs.mode == 'aggregate' || github.event.inputs.mode == 'all' }}
        run: npm run aggregate

      - name: Commit & push
        run: |
          git config user.name  "sales-bot"
          git config user.email "sales-bot@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "chore(data): update sales snapshot $(date -u +%FT%TZ)"
            git push
          fi

      # ── 데이터 갱신 후 Pages 도 즉시 재배포 ──
      - name: Pull latest (커밋 후 최신 상태 가져오기)
        run: git pull --rebase || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
